good_for: 'The best all-rounder: Wi-Fi, Bluetooth, lots of PWM pins and plenty of speed for robots.'
watch_out: "3.3V logic. GPIO 0, 2, 5, 12 and 15 are strapping pins; 34\u201339 are input-only."
