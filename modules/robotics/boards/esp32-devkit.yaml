pins:
- id: '1'
  label: GPIO 1 (TX0)
  caps:
  - digital
  - output
  - pwm
  reserved: USB serial
  note: USB serial TX. Using it breaks Serial.print and uploads.
- id: '2'
  label: GPIO 2
  caps:
  - digital
  - output
  - pwm
  - adc2
  - touch
  strapping: warn
  note: Onboard LED; must be low or floating at boot.
- id: '3'
  label: GPIO 3 (RX0)
  caps:
  - digital
  - output
  - pwm
  reserved: USB serial
  note: USB serial RX. Using it breaks Serial.print and uploads.
- id: '4'
  label: GPIO 4
  caps:
  - digital
  - output
  - pwm
  - adc2
  - touch
- id: '5'
  label: GPIO 5
  caps:
  - digital
  - output
  - pwm
  strapping: warn
  note: Outputs a PWM pulse at boot.
- id: '12'
  label: GPIO 12
  caps:
  - digital
  - output
  - pwm
  - adc2
  - touch
  strapping: bad
  note: Sets flash voltage at boot. A load here can stop the board starting.
- id: '13'
  label: GPIO 13
  caps:
  - digital
  - output
  - pwm
  - adc2
  - touch
- id: '14'
