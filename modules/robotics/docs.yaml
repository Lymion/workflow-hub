# Docs the hub downloads for the docs guide. Only these pages are fetched (no crawling).
docs:
  - { id: arduino-pulsein, title: "Arduino · pulseIn()", url: "https://docs.arduino.cc/language-reference/en/functions/advanced-io/pulseIn/" }
  - { id: arduino-millis, title: "Arduino · millis()", url: "https://docs.arduino.cc/language-reference/en/functions/time/millis/" }
  - { id: arduino-digitalwrite, title: "Arduino · digitalWrite()", url: "https://docs.arduino.cc/language-reference/en/functions/digital-io/digitalwrite/" }
  - { id: arduino-analogread, title: "Arduino · analogRead()", url: "https://docs.arduino.cc/language-reference/en/functions/analog-io/analogRead/" }
  - { id: arduino-interrupts, title: "Arduino · attachInterrupt()", url: "https://docs.arduino.cc/language-reference/en/functions/external-interrupts/attachInterrupt/" }
  - { id: esp32-gpio, title: "ESP32 Arduino core · GPIO", url: "https://docs.espressif.com/projects/arduino-esp32/en/latest/api/gpio.html" }
  - { id: esp32-ledc, title: "ESP32 Arduino core · LEDC (PWM)", url: "https://docs.espressif.com/projects/arduino-esp32/en/latest/api/ledc.html" }
  - { id: esp32-i2c, title: "ESP32 Arduino core · I2C", url: "https://docs.espressif.com/projects/arduino-esp32/en/latest/api/i2c.html" }
  - { id: esp32-adc, title: "ESP32 Arduino core · ADC", url: "https://docs.espressif.com/projects/arduino-esp32/en/latest/api/adc.html" }
  - { id: pio-lib-deps, title: "PlatformIO · lib_deps", url: "https://docs.platformio.org/en/latest/projectconf/sections/env/options/library/lib_deps.html" }
  - { id: pio-monitor-speed, title: "PlatformIO · monitor_speed", url: "https://docs.platformio.org/en/latest/projectconf/sections/env/options/monitor/monitor_speed.html" }

# Official doc sites. Read online inside the hub (nothing downloaded); the online Ask
# searches their page lists (search.url: tried in order, first that works).
sites:
  - id: arduino
    title: Arduino docs
    about: Language reference (every function), libraries, boards
    home: https://docs.arduino.cc/language-reference/
    search: { type: sitemap, url: [https://docs.arduino.cc/sitemap-index.xml, https://docs.arduino.cc/sitemap.xml], prefix: "https://docs.arduino.cc/" }
  - id: esp32
    title: ESP32 Arduino core
    about: Wi-Fi, BLE, PWM (LEDC), ADC, I2C and other ESP32 APIs
    home: https://docs.espressif.com/projects/arduino-esp32/en/latest/
    search: { type: sphinx, url: https://docs.espressif.com/projects/arduino-esp32/en/latest/searchindex.js }
  - id: platformio
    title: PlatformIO
    about: platformio.ini options, boards, libraries, build and upload
    home: https://docs.platformio.org/en/latest/
    search: { type: sphinx, url: https://docs.platformio.org/en/latest/searchindex.js }
