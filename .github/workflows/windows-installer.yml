# Builds the Windows installer (Workflow Hub_x.y.z_x64-setup.exe).
# Download it from the run's "Artifacts" section, or from Releases when you push a tag like v0.1.0.
name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine tests on Windows
        run: |
          python -m pip install -r engine/requirements-dev.txt
          python -m pytest -q -o addopts=""

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the engine (no Python needed on the user's PC)
        run: |
          python -m pip install -r engine/requirements.txt pyinstaller
          python packaging/build_engine.py

      - name: Check the built engine starts
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\hubcheck"
          $p = Start-Process -FilePath app\src-tauri\engine-dist\engine.exe -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8765/health | Out-Null; $ok = $true; break } catch { Start-Sleep -Milliseconds 500 }
          }
          if ($ok) { Invoke-RestMethod http://127.0.0.1:8765/modules | ConvertTo-Json -Depth 2 | Select-Object -First 5 }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "The built engine did not answer on port 8765." }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: Workflow-Hub-Windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/src-tauri/target/release/bundle/nsis/*.exe
