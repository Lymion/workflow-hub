# Builds the Windows installer (Workflow Hub_x.y.z_x64-setup.exe).
# Every push: the installer is in the run's "Artifacts" section.
# A push to main whose version has no release yet (bump the version in the PR, merge it)
# publishes a GitHub release tagged v<version> with latest.json, which the app's
# auto-updater checks. Pushing a v* tag does the same. Builds are signed with the TAURI_SIGNING_PRIVATE_KEY secret.
name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine tests on Windows
        run: |
          python -m pip install -r engine/requirements-dev.txt
          python -m pytest -q -o addopts=""

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the engine (no Python needed on the user's PC)
        run: |
          python -m pip install -r engine/requirements.txt pyinstaller
          python packaging/build_engine.py

      - name: Check the built engine starts
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\hubcheck"
          $p = Start-Process -FilePath app\src-tauri\engine-dist\engine.exe -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8765/health | Out-Null; $ok = $true; break } catch { Start-Sleep -Milliseconds 500 }
          }
          if ($ok) { Invoke-RestMethod http://127.0.0.1:8765/modules | ConvertTo-Json -Depth 2 | Select-Object -First 5 }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "The built engine did not answer on port 8765." }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Publish this version? (main with a version that has no release yet, or a v* tag)
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "from engine.config import VERSION; print(VERSION)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME doesn't match the app version $v. Run packaging/bump_version.py first."; exit 1; fi
            publish=true
          elif [ "$GITHUB_REF" == "refs/heads/main" ] && ! gh release view "v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $v, publish: $publish"

      - name: Build the installer (signed for the auto-updater)
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: Workflow-Hub-Windows-installer
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      - name: Release files and latest.json
        if: steps.decide.outputs.publish == 'true'
        shell: bash
        run: |
          setup=$(ls app/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          python packaging/make_release.py "${{ steps.decide.outputs.version }}" "$setup" release

      - name: Publish the release (the app's updater reads latest.json from it)
        if: steps.decide.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.decide.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Workflow Hub ${{ steps.decide.outputs.version }}
          body_path: release/notes.md
          make_latest: true
          files: |
            release/Workflow-Hub_*_x64-setup.exe
            release/latest.json
