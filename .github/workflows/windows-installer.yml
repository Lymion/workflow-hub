# Builds the Windows installer (Workflow Hub_x.y.z_x64-setup.exe).
# Every push: the installer is in the run's "Artifacts" section.
# A tag like v0.3.0 also publishes a GitHub release with latest.json, which the app's
# auto-updater checks. Builds are signed with the TAURI_SIGNING_PRIVATE_KEY secret.
name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine tests on Windows
        run: |
          python -m pip install -r engine/requirements-dev.txt
          python -m pytest -q -o addopts=""

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the engine (no Python needed on the user's PC)
        run: |
          python -m pip install -r engine/requirements.txt pyinstaller
          python packaging/build_engine.py

      - name: Check the built engine starts
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\hubcheck"
          $p = Start-Process -FilePath app\src-tauri\engine-dist\engine.exe -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8765/health | Out-Null; $ok = $true; break } catch { Start-Sleep -Milliseconds 500 }
          }
          if ($ok) { Invoke-RestMethod http://127.0.0.1:8765/modules | ConvertTo-Json -Depth 2 | Select-Object -First 5 }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "The built engine did not answer on port 8765." }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Tag matches the app version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "from engine.config import VERSION; print(VERSION)")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} doesn't match the app version $v. Run packaging/bump_version.py first."; exit 1; fi

      - name: Build the installer (signed for the auto-updater)
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: Workflow-Hub-Windows-installer
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      - name: Release files and latest.json (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          setup=$(ls app/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          python packaging/make_release.py "${GITHUB_REF_NAME}" "$setup" release

      - name: Publish the release (tags only; the app's updater reads latest.json from it)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Workflow Hub ${{ github.ref_name }}
          body_path: release/notes.md
          make_latest: true
          files: |
            release/Workflow-Hub_*_x64-setup.exe
            release/latest.json
